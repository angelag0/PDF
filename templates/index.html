<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="功能強大的本機 PDF 編輯器 — 支援文字編輯、圖片嵌入、裁切、合併與多格式匯出">
    <title>PDF 編輯器</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Fabric.js -->
    <script src="/static/js/fabric.min.js"></script>
</head>
<body>

<div id="app">
    <!-- ===== Toolbar ===== -->
    <div id="toolbar">
        <!-- Logo -->
        <div class="toolbar-group" style="padding-right:12px">
            <span style="font-size:20px; font-weight:700; background:linear-gradient(135deg,#6366f1,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
                📄 PDF Editor
            </span>
        </div>

        <!-- Mode Tabs -->
        <div class="toolbar-group">
            <div class="mode-tabs">
                <button class="mode-tab active" data-mode="edit" id="mode-edit-btn">✏️ 編輯</button>
                <button class="mode-tab" data-mode="merge" id="mode-merge-btn">📑 合併</button>
                <button class="mode-tab" data-mode="crop" id="mode-crop-btn">✂️ 裁切</button>
            </div>
        </div>

        <!-- Edit Tools -->
        <div class="toolbar-group" id="edit-tools">
            <span class="toolbar-group-label">工具</span>
            <button class="tool-btn active" id="tool-select" data-tool="select" title="選取文字">
                🔤
            </button>
            <button class="tool-btn" id="tool-text" data-tool="text" title="輸入文字">
                📝
            </button>
            <button class="tool-btn" id="tool-image" data-tool="image" title="插入圖片">
                🖼️
            </button>
        </div>

        <!-- Actions -->
        <div class="toolbar-group" id="action-tools">
            <span class="toolbar-group-label">操作</span>
            <button class="tool-btn" id="btn-undo" title="復原 (Ctrl+Z)">↩️</button>
            <button class="tool-btn" id="btn-redo" title="重做 (Ctrl+Y)">↪️</button>
            <button class="tool-btn" id="btn-delete-page" title="刪除當前頁">🗑️</button>
        </div>

        <!-- Spacer -->
        <div style="flex:1"></div>

        <!-- Export -->
        <div class="toolbar-group">
            <div class="dropdown-wrapper">
                <button class="btn btn-primary" id="btn-export">
                    💾 匯出 ▾
                </button>
                <div class="dropdown-menu" id="export-dropdown">
                    <button class="dropdown-item" id="export-pdf">📄 匯出 PDF</button>
                    <button class="dropdown-item" id="export-jpg">🖼️ 匯出 JPG</button>
                    <button class="dropdown-item" id="export-docx">📝 匯出 Word</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== Main Area ===== -->
    <div id="main-area">
        <!-- Sidebar: Thumbnails -->
        <div id="sidebar">
            <div class="sidebar-header">
                <span>📄 頁面</span>
                <button class="tool-btn" id="toggle-sidebar" style="width:24px;height:24px;font-size:12px;">◀</button>
            </div>
            <div id="thumbnail-list"></div>
        </div>

        <!-- Canvas Area -->
        <div id="canvas-area">
            <!-- Upload Screen -->
            <div id="upload-screen">
                <div class="upload-hero">
                    <h1>PDF 編輯器</h1>
                    <p>拖放 PDF 檔案或點擊下方上傳</p>
                </div>
                <div class="upload-zone" id="upload-zone">
                    <span class="upload-icon">📂</span>
                    <p class="upload-text">拖放 PDF 至此處</p>
                    <p class="upload-hint">或點擊選擇檔案 · 支援最大 200MB</p>
                    <button class="upload-btn" id="upload-btn">
                        📤 選擇 PDF 檔案
                    </button>
                </div>
                <input type="file" id="file-input" accept=".pdf">
            </div>

            <!-- PDF Viewer -->
            <div id="canvas-container" class="hidden">
                <div id="pdf-canvas-wrapper">
                    <img id="pdf-page-img" alt="PDF Page">
                    <!-- Text overlay for selection -->
                    <div id="text-overlay"></div>
                    <!-- Selection rectangle -->
                    <div id="selection-rect"></div>
                    <!-- Fabric Canvas overlay -->
                    <div id="fabric-canvas-wrapper">
                        <canvas id="fabric-canvas"></canvas>
                    </div>
                    <!-- Crop lines container -->
                    <div id="crop-overlay" class="hidden"></div>
                </div>
            </div>

            <!-- Merge Panel (overlay) -->
            <div id="merge-panel">
                <div class="merge-header">
                    <h2>📑 PDF 合併</h2>
                    <div style="display:flex; gap:8px;">
                        <button class="btn btn-secondary" id="merge-add-files">📤 新增檔案</button>
                        <button class="btn btn-primary" id="merge-execute">🔗 開始合併</button>
                        <button class="btn btn-secondary" id="merge-close">✕ 關閉</button>
                    </div>
                </div>
                <div class="merge-content">
                    <div class="merge-file-list" id="merge-file-list">
                        <div class="merge-upload-zone" id="merge-upload-zone">
                            <span style="font-size:36px; margin-bottom:8px;">📑</span>
                            <p style="color:var(--text-secondary);">拖放多個 PDF 檔案至此</p>
                            <p style="color:var(--text-tertiary); font-size:12px; margin-top:4px;">拖拽排序以決定合併順序</p>
                        </div>
                    </div>
                </div>
                <input type="file" id="merge-file-input" accept=".pdf" multiple>
            </div>
        </div>

        <!-- Properties Panel -->
        <div id="properties-panel">
            <!-- Text Properties -->
            <div class="panel-section" id="text-properties" style="display:none;">
                <div class="panel-section-title">文字屬性</div>
                <div class="panel-row">
                    <label>大小</label>
                    <input type="number" class="panel-input" id="font-size-input" value="14" min="6" max="200" step="1">
                    <span style="font-size:12px; color:var(--text-tertiary);">pt</span>
                </div>
                <div class="panel-row">
                    <label>顏色</label>
                    <input type="color" class="panel-input" id="font-color-input" value="#000000">
                    <input type="text" class="panel-input" id="font-color-hex" value="#000000" style="width:80px;">
                </div>
                <div class="panel-row" style="margin-top:8px;">
                    <button class="btn btn-primary" id="btn-confirm-text" style="width:100%;">✓ 確認加入文字</button>
                </div>
            </div>

            <!-- Image Properties -->
            <div class="panel-section" id="image-properties" style="display:none;">
                <div class="panel-section-title">圖片屬性</div>
                <div class="panel-row">
                    <label>寬度</label>
                    <input type="number" class="panel-input" id="img-width-input" min="10">
                </div>
                <div class="panel-row">
                    <label>高度</label>
                    <input type="number" class="panel-input" id="img-height-input" min="10">
                </div>
                <div class="panel-row">
                    <label>X</label>
                    <input type="number" class="panel-input" id="img-x-input">
                </div>
                <div class="panel-row">
                    <label>Y</label>
                    <input type="number" class="panel-input" id="img-y-input">
                </div>
                <div class="panel-row" style="margin-top:8px;">
                    <button class="btn btn-primary" id="btn-confirm-image" style="width:100%;">✓ 確認合併進 PDF</button>
                </div>
            </div>

            <!-- Selection Info -->
            <div class="panel-section" id="selection-info" style="display:none;">
                <div class="panel-section-title">選取與編輯文字</div>
                <textarea id="selected-text-preview" rows="5" style="
                    width: 100%;
                    background: var(--bg-tertiary);
                    border: 1px solid var(--border-primary);
                    border-radius: var(--radius-sm);
                    padding: 10px;
                    font-size: 13px;
                    line-height: 1.5;
                    color: var(--text-primary);
                    word-break: break-all;
                    resize: vertical;
                    font-family: inherit;
                    outline: none;
                "></textarea>
                <div style="display:flex; gap:6px; margin-top:10px;">
                    <button class="btn btn-primary" id="btn-edit-text" style="flex:1.2;">✏️ 修改文字</button>
                    <button class="btn btn-secondary" id="btn-copy-text" style="flex:1;">📋 複製</button>
                    <button class="btn btn-danger" id="btn-delete-text" style="flex:1;">🗑️ 刪除</button>
                </div>
            </div>

            <!-- Crop Controls -->
            <div class="panel-section" id="crop-controls" style="display:none;">
                <div class="panel-section-title">裁切控制</div>
                <button class="btn btn-secondary" id="btn-add-cut-line" style="width:100%; margin-bottom:8px;">➕ 新增切割線</button>
                <div id="cut-lines-list" style="display:flex; flex-direction:column; gap:4px; margin-bottom:10px;"></div>
                <button class="btn btn-primary" id="btn-preview-crop" style="width:100%; margin-bottom:8px;">👁️ 預覽切片</button>
                <button class="btn btn-success" id="btn-apply-crop" style="width:100%;">✓ 套用裁切</button>
            </div>

            <!-- Page Info -->
            <div class="panel-section" id="page-info-section">
                <div class="panel-section-title">頁面資訊</div>
                <div style="font-size:12px; color:var(--text-secondary); line-height:1.8;">
                    <div>文件: <span id="info-filename">—</span></div>
                    <div>頁碼: <span id="info-page">—</span></div>
                    <div>尺寸: <span id="info-size">—</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== Status Bar ===== -->
    <div id="statusbar">
        <div class="status-item" id="status-doc">
            <span>未開啟文件</span>
        </div>
        <div class="status-separator"></div>
        <div class="status-item" id="status-tool">
            <span>選取工具</span>
        </div>
        <div id="zoom-controls">
            <button id="zoom-out" title="縮小">−</button>
            <span id="zoom-value">100%</span>
            <button id="zoom-in" title="放大">+</button>
            <button id="zoom-fit" title="適合寬度">⊡</button>
        </div>
    </div>
</div>

<!-- Toast Container -->
<div id="toast-container"></div>

<!-- Loading Overlay -->
<div id="loading-overlay">
    <div class="loader">
        <div class="loader-spinner"></div>
        <div class="loader-text" id="loading-text">處理中...</div>
    </div>
</div>

<!-- Context Menu -->
<div id="context-menu">
    <button class="ctx-menu-item" id="ctx-copy">📋 複製文字<span class="shortcut">Ctrl+C</span></button>
    <button class="ctx-menu-item" id="ctx-delete">🗑️ 刪除文字<span class="shortcut">Del</span></button>
    <div class="ctx-menu-divider"></div>
    <button class="ctx-menu-item" id="ctx-select-all">🔲 全選<span class="shortcut">Ctrl+A</span></button>
</div>

<!-- Hidden file input for image upload -->
<input type="file" id="image-file-input" accept="image/*">

<!-- Scripts -->
<script src="/static/js/undo-manager.js"></script>
<script src="/static/js/pdf-viewer.js"></script>
<script src="/static/js/text-editor.js"></script>
<script src="/static/js/image-editor.js"></script>
<script src="/static/js/crop-editor.js"></script>
<script src="/static/js/merge-editor.js"></script>
<script src="/static/js/app.js"></script>

</body>
</html>
